#===========================================================================
# Test Results
#===========================================================================

  - type: "test_result"
    name: "CCA ESS Test 2025-12-18T08:55:00Z"
    properties:
      description: "Test for CCA ESS"
      system_id: "${sys_ctts001}"
      part_number: "Sensor-X-CCA"
      serial_number: "SENSOR-0001"
      test_phase: "ESS"
      start_time: "2025-12-18T08:55:00Z"
      end_time: "2025-12-18T09:28:00Z"
      status: "passed"
      operator: "Test Engineer A"
      test_verdict: "PASS"
      data_table_id: "cca_ess_test_2025_12_18T08_55_00Z"
      files:
        - "cca_ess_test_2025-12-18T08:55:00Z.csv"
      station: "${sys_ctts001}"
      measurements: #this should be "properties" but we are using "measurements" to match the py script
        Fixture: "Fixture-0001"
        Dut_Cable: "cbl-0001"
        Voltage_Insturment: "PXIe-4303"
      steps:
        - name: "Set Thermotron to Cold Temperature"
          step_type: "Action"
          status: "Done"
          started_at: "2025-12-18T07:55:00Z"
          total_time_in_seconds: 3602
          inputs:
            Temp (C): "-40.0"
          outputs:
            Temp (C): "-40.1"
        - name: "Measure Voltages at Cold Temperature"
          step_type: "NumericLimitTest"
          status: "passed"
          started_at: "2025-12-18T08:55:00Z"
          total_time_in_seconds: 5
          properties:
            Temp: "-40C"
          data:
            parameters:
              - name: "V_3.3"
                measurement: "3.31"
                lowLimit: "3.00"
                highLimit: "3.60"
                units: "V"
                status: "Passed"
                comparisonType: "GELE"
              - name: "V_5.0"
                measurement: "5.01"
                lowLimit: "4.75"
                highLimit: "5.25"
                units: "V"
                status: "Passed"
                comparisonType: "GELE"
              - name: "V_gnd"
                measurement: "0.01"
                lowLimit: "-0.05"
                highLimit: "0.05"
                units: "V"
                status: "Passed"
                comparisonType: "GELE"
        - name: "Set Thermotron to Hot Temperature"
          step_type: "Action"
          status: "Done"
          started_at: "2025-12-18T09:55:00Z"
          total_time_in_seconds: 3602
          inputs:
            Temp (C): "85.0"
          outputs:
            Temp (C): "85.1"
        - name: "Measure Voltages at Hot Temperature"
          step_type: "NumericLimitTest"
          status: "passed"
          started_at: "2025-12-18T09:55:00Z"
          total_time_in_seconds: 5
          properties:
            Temp: "85C"
          data:
            parameters:
              - name: "V_3.3"
                measurement: "3.28"
                lowLimit: "3.00"
                highLimit: "3.60"
                units: "V"
                status: "Passed"
                comparisonType: "GELE"
              - name: "V_5.0"
                measurement: "5.05"
                lowLimit: "4.75"
                highLimit: "5.25"
                units: "V"
                status: "Passed"
                comparisonType: "GELE"
              - name: "V_gnd"
                measurement: "0.01"
                lowLimit: "-0.05"
                highLimit: "0.05"
                units: "V"
                status: "Passed"
                comparisonType: "GELE"
    id_reference: "cca_ess_test_2025_12_18T09_55_00Z"
    tags: ["example-cca-prod-test"]

